<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publication list</title>
    <meta name="robots" content="noindex" />
    <!--
      Styling is inline and self-contained on purpose.

      This document is rendered inside someone else's page, so it gets no
      stylesheet of ours from anywhere else and must not need one — an extra
      request would show up as a flash of unstyled list inside their layout.
      Two rules follow from living in a frame:

        * The background stays transparent, so the host page's own background
          shows through and the frame does not read as a pasted-in white box.
        * Type and colour stay neutral — a plain system stack and greys — so
          the list looks like part of whatever page it lands in rather than
          like a fragment of this project's design.

      Sized for narrow frames down to 320px: nothing has a fixed width, long
      DOIs and URLs wrap instead of forcing a horizontal scrollbar, and the
      type steps down one notch below 380px.
    -->
    <style>
      :root {
        color-scheme: light;
      }

      html {
        background: transparent;
      }

      /*
        No padding on `body`: /embed-height.js measures the bottom edge of
        body's children, so bottom padding here would be invisible to it and
        the parent frame would clip the last line. Spacing goes on the
        container instead, where it sits inside a measured element.
      */
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #24292f;
        font:
          400 15px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          'Hiragino Kaku Gothic ProN',
          'Noto Sans JP',
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      #publist-widget {
        padding: 2px 2px 10px;
      }

      .publist-heading {
        margin: 1.7em 0 0.6em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid rgba(0, 0, 0, 0.12);
        color: #57606a;
        font-size: 0.9375rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .publist > .publist-heading:first-child {
        margin-top: 0;
      }

      /*
        The year divider inside a publication-type section. Deliberately
        quieter than the heading above it — no rule, smaller, lighter — so the
        two levels read as a hierarchy rather than as two competing headings.
      */
      .publist-subheading {
        margin: 1.2em 0 0.4em;
        color: #6e7781;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      /* Straight after its category heading there is no gap to reopen. */
      .publist-heading + .publist-subheading {
        margin-top: 0.5em;
      }

      .publist-list {
        margin: 0;
        padding-left: 1.6em;
      }

      .publist-item {
        margin: 0 0 0.75em;
        /* Long DOIs and URLs must break rather than widen the frame. */
        overflow-wrap: anywhere;
      }

      .publist-item:last-child {
        margin-bottom: 0;
      }

      .publist-item a {
        color: #0969da;
      }

      .publist-pmid {
        color: #57606a;
        font-size: 0.9em;
        white-space: nowrap;
      }

      /* The two trailer lines: same small, muted treatment for both. */
      .publist-disclaimer {
        margin: 1.8em 0 0;
        color: #6e7781;
        font-size: 0.8125rem;
      }

      .publist-credit {
        margin: 1.8em 0 0;
        color: #6e7781;
        font-size: 0.8125rem;
      }

      /* Together they are one block, not two paragraphs with a gap between. */
      .publist-disclaimer + .publist-credit {
        margin-top: 0.4em;
      }

      .publist-credit a {
        color: #6e7781;
      }

      /* Loading and failure states — the frame is never left blank. */
      .widget-status,
      .widget-error {
        margin: 0;
        padding: 0.4em 0;
        color: #57606a;
        font-size: 0.9375rem;
      }

      /*
        The loading spinner.

        A frame that has not resolved yet has nothing else in it to look at —
        unlike the script embed, which still shows its snapshot — so the wait
        needs a moving mark as well as the stage text next to it.

        Two borders and a keyframe, no asset and no request: an <img> or an SVG
        sprite would be a second round trip on the critical path of a frame
        whose whole job is to appear quickly. `currentColor` keeps it the same
        grey as the text beside it, which is what keeps it neutral inside
        someone else's page.
      */
      .publist-spinner {
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-inline-end: 0.55em;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        vertical-align: -0.1em;
        opacity: 0.75;
      }

      @media (prefers-reduced-motion: no-preference) {
        .publist-spinner {
          animation: publist-spin 0.75s linear infinite;
        }
      }

      /*
        Without the animation the gap in the ring reads as a stalled spinner,
        so close it: what is left is a static bullet next to the stage text,
        and the text is what carries the information anyway.
      */
      @media (prefers-reduced-motion: reduce) {
        .publist-spinner {
          border-top-color: currentColor;
          opacity: 0.45;
        }
      }

      @keyframes publist-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .widget-error-detail {
        margin: 0.4em 0 0;
        color: #8c959f;
        font-size: 0.8125rem;
        overflow-wrap: anywhere;
      }

      @media (max-width: 380px) {
        body {
          font-size: 14px;
        }

        .publist-list {
          padding-left: 1.35em;
        }
      }

    </style>
  </head>
  <body data-mode="widget">
    <!--
      The loading line and its spinner ship in the served HTML so the frame is
      never blank, not even in the moment before the module below parses. The
      spinner is markup plus CSS above rather than something the script builds,
      for that reason: a spinner that only appears once JavaScript has run is
      absent for exactly the part of the wait it exists to cover.

      The message text lives in its own span because the progress callback in
      main.ts rewrites it as the build moves through its stages, and it must
      rewrite the words without removing the spinner beside them.
    -->
    <div id="publist-widget" class="widget" data-publist-state="loading">
      <p class="widget-status">
        <span class="publist-spinner" aria-hidden="true"></span>
        <span class="widget-status-text">Loading publications…</span>
      </p>
    </div>

    <script type="module" src="/src/widget/main.ts"></script>
    <!-- Reports this frame's height to the parent page (embed:height standard). -->
    <script type="module" src="/embed-height.js"></script>
  </body>
</html>
