name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # The embed script is injected into other people's pages, so its transfer
      # size is a promise, not a detail. 20 KB gzipped is the budget; without
      # this check a stray dependency would blow it silently.
      - name: Check the embed size budget
        run: |
          budget=20480
          size=$(gzip -9 -c dist/embed.js | wc -c | tr -d ' ')
          echo "dist/embed.js: $size bytes gzipped (budget $budget)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error file=src/embed/entry.ts::dist/embed.js is $size bytes gzipped, over the $budget-byte budget by $((size - budget)) bytes."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
